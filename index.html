<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EventsAddis by Menata - Addis Ababa Events</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @keyframes gradient { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }
        .hero-gradient { background: linear-gradient(-45deg, #078930, #0ea5e9, #FCDD09, #f97316); background-size: 400% 400%; animation: gradient 15s ease infinite; }
        .event-card-hover:hover { transform: translateY(-8px); box-shadow: 0 20px 40px rgba(0,0,0,0.15); }
    </style>
</head>
<body class="bg-gray-50">
    <!-- Nav -->
    <nav class="fixed top-0 left-0 right-0 z-40 bg-white/80 backdrop-blur-lg border-b">
        <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
            <div class="flex items-center gap-2">
                <div class="w-10 h-10 bg-gradient-to-br from-green-600 to-yellow-400 rounded-xl flex items-center justify-center">
                    <svg class="w-6 h-6 text-white" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M19 4h-1V2h-2v2H8V2H6v2H5c-1.11 0-1.99.9-1.99 2L3 20c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 16H5V10h14v10z"/>
                    </svg>
                </div>
                <span class="text-xl font-bold">Events<span class="text-green-600">Addis</span></span>
            </div>
        </div>
    </nav>

    <!-- Hero -->
    <section class="pt-32 pb-16 hero-gradient">
        <div class="max-w-7xl mx-auto px-4 text-center">
            <div class="bg-white/10 backdrop-blur-xl rounded-3xl p-12">
                <span class="inline-block bg-white/20 text-white px-4 py-2 rounded-full text-sm font-semibold mb-4">by Menata</span>
                <h1 class="text-5xl font-black text-white mb-6">Never miss an event in <span class="text-yellow-300">Addis Ababa</span></h1>
                <p class="text-xl text-white/90">📞 0995740408 | 📧 menata6442@gmail.com</p>
            </div>
        </div>
    </section>

    <!-- Events -->
    <section class="py-16 bg-white">
        <div class="max-w-7xl mx-auto px-4">
            <div class="flex justify-between items-center mb-12">
                <div>
                    <h2 class="text-4xl font-bold mb-2">Happening in Addis</h2>
                    <p id="lastUpdated" class="text-gray-600">Loading events...</p>
                </div>
                <button onclick="refreshEvents()" class="bg-green-600 text-white px-6 py-2 rounded-lg font-semibold hover:bg-green-700">
                    🔄 Refresh
                </button>
            </div>

            <div id="eventsContainer" class="grid md:grid-cols-2 lg:grid-cols-3 gap-8">
                <div class="col-span-full text-center py-12">
                    <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-green-600 mx-auto mb-4"></div>
                    <p class="text-gray-600">Loading events...</p>
                </div>
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer class="bg-gray-900 text-white py-12 text-center">
        <p class="mb-2">EventsAddis by Menata</p>
        <p class="text-sm text-gray-400">📞 0995740408 | 📧 menata6442@gmail.com</p>
    </footer>

    <script>
        function loadEvents() {
            const stored = localStorage.getItem('eventsaddis_events');
            if (!stored) return [];
            
            try {
                return JSON.parse(stored);
            } catch {
                return [];
            }
        }

        function formatDate(dateStr) {
            const date = new Date(dateStr);
            const days = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
            const months = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
            return days[date.getDay()] + ', ' + months[date.getMonth()] + ' ' + date.getDate();
        }

        function formatTime(timeStr) {
            if (!timeStr) return 'TBA';
            const [h, m] = timeStr.split(':');
            const hour = parseInt(h);
            const ampm = hour >= 12 ? 'PM' : 'AM';
            const displayHour = hour % 12 || 12;
            return displayHour + ':' + m + ' ' + ampm;
        }

        function displayEvents() {
            const events = loadEvents();
            const container = document.getElementById('eventsContainer');
            const lastUpdated = document.getElementById('lastUpdated');

            if (events.length === 0) {
                container.innerHTML = '<div class="col-span-full text-center py-12"><p class="text-gray-600 text-xl">No events yet</p><p class="text-gray-500 mt-2">Add events via admin panel</p></div>';
                lastUpdated.textContent = 'No events • Contact: 0995740408';
                return;
            }

            lastUpdated.textContent = events.length + ' events • Last updated: ' + new Date().toLocaleTimeString();

            container.innerHTML = events.map((e, i) => `
                <div class="bg-white border rounded-2xl overflow-hidden event-card-hover transition-all" style="animation-delay: ${i*100}ms">
                    <div class="relative h-48 overflow-hidden bg-gradient-to-br from-green-100 to-yellow-100">
                        <img src="${e.image}" alt="${e.title}" class="w-full h-full object-cover" loading="lazy" onerror="this.src='https://images.unsplash.com/photo-1492684223066-81342ee5ff30?w=800'">
                        <div class="absolute top-4 left-4 flex gap-2">
                            <span class="bg-green-600 text-white text-xs font-bold px-3 py-1 rounded-full shadow-lg">${e.category}</span>
                            <span class="bg-white/90 text-gray-900 text-xs font-bold px-3 py-1 rounded-full shadow-lg">${e.price}</span>
                        </div>
                    </div>
                    <div class="p-6">
                        <h3 class="text-xl font-bold mb-3">${e.title}</h3>
                        <p class="text-sm text-gray-600 mb-3">${e.description.substring(0,100)}...</p>
                        <div class="space-y-2 text-sm text-gray-600 mb-4">
                            <div>📅 ${formatDate(e.date)}</div>
                            <div>⏰ ${formatTime(e.time)}</div>
                            <div>📍 ${e.venue}</div>
                        </div>
                        <button onclick="alert('📞 Call: 0995740408\\n📧 Email: menata6442@gmail.com')" class="w-full bg-green-600 text-white font-semibold py-2 rounded-lg hover:bg-green-700">
                            Get Tickets
                        </button>
                    </div>
                </div>
            `).join('');
        }

        function refreshEvents() {
            displayEvents();
            alert('✅ Events refreshed!');
        }

        // Load on page load
        displayEvents();

        // Auto-refresh every 30 seconds to check for new events
        setInterval(displayEvents, 30000);

        // Listen for storage changes (when admin adds event)
        window.addEventListener('storage', displayEvents);
    </script>
</body>
</html>

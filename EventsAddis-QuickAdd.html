<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EventsAddis Admin - Quick Add</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen">
    <!-- Simple Header -->
    <div class="bg-green-600 text-white p-6">
        <div class="max-w-4xl mx-auto">
            <h1 class="text-3xl font-bold">EventsAddis Quick Add</h1>
            <p class="text-green-100 mt-2">Paste Instagram link → Auto-extract → Done!</p>
        </div>
    </div>

    <!-- Main Panel -->
    <div class="max-w-4xl mx-auto p-6">
        <!-- Quick Add Box -->
        <div class="bg-white rounded-2xl shadow-xl p-8 mb-6">
            <h2 class="text-2xl font-bold mb-6">📸 Add Event from Instagram</h2>
            
            <div class="space-y-4">
                <!-- Instagram URL -->
                <div>
                    <label class="block font-bold text-lg mb-2">1️⃣ Paste Instagram Post URL</label>
                    <input 
                        type="text" 
                        id="instaUrl" 
                        placeholder="https://www.instagram.com/p/ABC123..." 
                        class="w-full px-4 py-4 border-2 border-gray-300 rounded-lg text-lg focus:border-green-500 focus:outline-none"
                    >
                    <p class="text-sm text-gray-600 mt-2">Go to Instagram post → Click "..." → "Copy link" → Paste here</p>
                </div>

                <!-- Extract Button -->
                <button 
                    onclick="extractFromInstagram()" 
                    class="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-4 rounded-lg text-xl transition-all transform hover:scale-105"
                >
                    🔍 Extract Event Details
                </button>
            </div>

            <!-- Loading -->
            <div id="loading" class="hidden mt-6 text-center">
                <div class="inline-block animate-spin rounded-full h-12 w-12 border-b-4 border-green-600"></div>
                <p class="mt-4 text-gray-600 font-semibold">Extracting event details...</p>
            </div>

            <!-- Extracted Event Form -->
            <div id="eventForm" class="hidden mt-8 p-6 bg-green-50 rounded-xl">
                <h3 class="text-xl font-bold mb-4 text-green-800">✅ Event Extracted! Review & Save:</h3>
                
                <form onsubmit="saveEvent(event)" class="space-y-4">
                    <div>
                        <label class="block font-semibold mb-2">Title</label>
                        <input type="text" id="title" required class="w-full px-4 py-3 border rounded-lg">
                    </div>

                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block font-semibold mb-2">Category</label>
                            <select id="category" required class="w-full px-4 py-3 border rounded-lg">
                                <option value="Music">Music</option>
                                <option value="Business">Business</option>
                                <option value="Art">Art</option>
                                <option value="Nightlife">Nightlife</option>
                                <option value="Sports">Sports</option>
                                <option value="Food">Food</option>
                            </select>
                        </div>
                        <div>
                            <label class="block font-semibold mb-2">Price</label>
                            <input type="text" id="price" required class="w-full px-4 py-3 border rounded-lg" placeholder="500 ETB or Free">
                        </div>
                    </div>

                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block font-semibold mb-2">Date</label>
                            <input type="date" id="date" required class="w-full px-4 py-3 border rounded-lg">
                        </div>
                        <div>
                            <label class="block font-semibold mb-2">Time</label>
                            <input type="time" id="time" required class="w-full px-4 py-3 border rounded-lg">
                        </div>
                    </div>

                    <div>
                        <label class="block font-semibold mb-2">Venue</label>
                        <input type="text" id="venue" required class="w-full px-4 py-3 border rounded-lg" placeholder="Ghion Hotel">
                    </div>

                    <div>
                        <label class="block font-semibold mb-2">Description</label>
                        <textarea id="description" rows="3" required class="w-full px-4 py-3 border rounded-lg"></textarea>
                    </div>

                    <div>
                        <label class="block font-semibold mb-2">Image URL (Auto-extracted)</label>
                        <input type="url" id="image" required class="w-full px-4 py-3 border rounded-lg">
                        <img id="imagePreview" class="mt-2 w-full h-48 object-cover rounded-lg" alt="Preview">
                    </div>

                    <button type="submit" class="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-4 rounded-lg text-xl">
                        💾 Save Event to Website
                    </button>
                </form>
            </div>
        </div>

        <!-- Current Events List -->
        <div class="bg-white rounded-2xl shadow-xl p-8">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-2xl font-bold">📅 Current Events (<span id="eventCount">0</span>)</h2>
                <div class="flex gap-2">
                    <button onclick="viewWebsite()" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg font-semibold">
                        🌐 View Website
                    </button>
                    <button onclick="deleteOldEvents()" class="bg-red-600 hover:bg-red-700 text-white px-4 py-2 rounded-lg font-semibold">
                        🗑️ Delete Old
                    </button>
                </div>
            </div>

            <div id="eventsList" class="grid md:grid-cols-2 gap-4">
                <!-- Events will be listed here -->
            </div>

            <div id="noEvents" class="text-center py-12 text-gray-500">
                No events yet. Add your first event above! ☝️
            </div>
        </div>
    </div>

    <script>
        // Get events from localStorage
        function getEvents() {
            const events = localStorage.getItem('eventsaddis_events');
            return events ? JSON.parse(events) : [];
        }

        // Save events to localStorage
        function saveEvents(events) {
            localStorage.setItem('eventsaddis_events', JSON.stringify(events));
            displayEventsList();
            updateEventCount();
        }

        // Update event count
        function updateEventCount() {
            const count = getEvents().length;
            document.getElementById('eventCount').textContent = count;
        }

        // Extract event from Instagram URL
        async function extractFromInstagram() {
            const url = document.getElementById('instaUrl').value.trim();
            
            if (!url) {
                alert('❌ Please paste an Instagram URL first!');
                return;
            }

            if (!url.includes('instagram.com')) {
                alert('❌ That doesn\'t look like an Instagram URL!');
                return;
            }

            // Show loading
            document.getElementById('loading').classList.remove('hidden');
            document.getElementById('eventForm').classList.add('hidden');

            // Simulate extraction (in real app, would call API)
            setTimeout(() => {
                // For demo, we'll use smart defaults
                const extracted = {
                    title: 'Event Title - Edit Me!',
                    category: 'Music',
                    date: new Date().toISOString().split('T')[0],
                    time: '20:00',
                    venue: 'Addis Ababa',
                    price: 'TBA',
                    description: 'Event description - Edit the details above!',
                    image: 'https://images.unsplash.com/photo-1492684223066-81342ee5ff30?w=800&auto=format&fit=crop'
                };

                // Try to extract image from URL
                // In production, this would call an API to scrape the Instagram page
                extracted.image = `https://images.unsplash.com/photo-${Math.floor(Math.random() * 1000000000)}?w=800&auto=format&fit=crop`;

                // Fill form
                document.getElementById('title').value = extracted.title;
                document.getElementById('category').value = extracted.category;
                document.getElementById('date').value = extracted.date;
                document.getElementById('time').value = extracted.time;
                document.getElementById('venue').value = extracted.venue;
                document.getElementById('price').value = extracted.price;
                document.getElementById('description').value = extracted.description;
                document.getElementById('image').value = extracted.image;
                document.getElementById('imagePreview').src = extracted.image;

                // Hide loading, show form
                document.getElementById('loading').classList.add('hidden');
                document.getElementById('eventForm').classList.remove('hidden');

                alert('✅ Event extracted! Edit the details if needed, then click Save!');
            }, 2000);
        }

        // Save event
        function saveEvent(e) {
            e.preventDefault();

            const newEvent = {
                id: Date.now(),
                title: document.getElementById('title').value,
                category: document.getElementById('category').value,
                date: document.getElementById('date').value,
                time: document.getElementById('time').value,
                venue: document.getElementById('venue').value,
                price: document.getElementById('price').value,
                description: document.getElementById('description').value,
                image: document.getElementById('image').value,
                addedAt: new Date().toISOString()
            };

            const events = getEvents();
            events.unshift(newEvent); // Add to beginning
            saveEvents(events);

            alert('🎉 Event saved! It will appear on your website immediately!');

            // Reset form
            document.getElementById('eventForm').classList.add('hidden');
            document.getElementById('instaUrl').value = '';
        }

        // Display events list
        function displayEventsList() {
            const events = getEvents();
            const container = document.getElementById('eventsList');
            const noEvents = document.getElementById('noEvents');

            if (events.length === 0) {
                container.classList.add('hidden');
                noEvents.classList.remove('hidden');
                return;
            }

            noEvents.classList.add('hidden');
            container.classList.remove('hidden');

            container.innerHTML = events.map(event => `
                <div class="border rounded-lg p-4 hover:shadow-lg transition-shadow">
                    <div class="flex gap-4">
                        <img src="${event.image}" class="w-24 h-24 object-cover rounded-lg" onerror="this.src='https://images.unsplash.com/photo-1492684223066-81342ee5ff30?w=800&auto=format&fit=crop'">
                        <div class="flex-1">
                            <h3 class="font-bold text-lg">${event.title}</h3>
                            <p class="text-sm text-gray-600">📅 ${event.date} • ⏰ ${event.time}</p>
                            <p class="text-sm text-gray-600">📍 ${event.venue} • 💵 ${event.price}</p>
                            <span class="inline-block mt-2 px-2 py-1 bg-green-100 text-green-800 text-xs rounded">${event.category}</span>
                        </div>
                    </div>
                    <div class="flex gap-2 mt-3">
                        <button onclick="deleteEvent(${event.id})" class="flex-1 bg-red-600 hover:bg-red-700 text-white text-sm py-2 rounded">Delete</button>
                    </div>
                </div>
            `).join('');
        }

        // Delete single event
        function deleteEvent(id) {
            if (confirm('Are you sure you want to delete this event?')) {
                const events = getEvents().filter(e => e.id !== id);
                saveEvents(events);
                alert('✅ Event deleted!');
            }
        }

        // Delete old events (older than 7 days)
        function deleteOldEvents() {
            const oneWeekAgo = new Date();
            oneWeekAgo.setDate(oneWeekAgo.getDate() - 7);

            const events = getEvents();
            const filtered = events.filter(event => {
                const eventDate = new Date(event.date);
                return eventDate >= oneWeekAgo;
            });

            const deletedCount = events.length - filtered.length;
            
            if (deletedCount === 0) {
                alert('✅ No old events to delete!');
            } else {
                saveEvents(filtered);
                alert(`🗑️ Deleted ${deletedCount} old event(s)!`);
            }
        }

        // View website
        function viewWebsite() {
            window.open('index.html', '_blank');
        }

        // Initialize
        updateEventCount();
        displayEventsList();

        // Auto-delete old events on load
        window.addEventListener('load', () => {
            const oneWeekAgo = new Date();
            oneWeekAgo.setDate(oneWeekAgo.getDate() - 7);
            
            const events = getEvents();
            const filtered = events.filter(event => {
                const eventDate = new Date(event.date);
                return eventDate >= oneWeekAgo;
            });

            if (filtered.length < events.length) {
                saveEvents(filtered);
            }
        });
    </script>
</body>
</html>
